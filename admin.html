<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBI Roast Admin - Secure</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6">
<div class="max-w-xl mx-auto">
<h1 class="text-3xl font-black">MBI ADMIN - Add Gari</h1>
<p class="text-white/40 text-xs mt-2">🔒 Protected by Cloudflare ENV</p>

<div id="login" class="mt-6">
<input id="pass" type="password" placeholder="Weka password ya admin" class="w-full p-3 rounded bg-white text-black">
<button onclick="login()" class="mt-3 bg-[#FF4D00] w-full p-3 rounded font-bold">INGIA</button>
<p id="err" class="text-red-400 text-sm mt-2 hidden">Wrong password - check Cloudflare ENV</p>
<p id="loading" class="text-white/60 text-sm mt-2 hidden">Checking...</p>
</div>

<div id="panel" class="hidden mt-6 space-y-4">
<input id="name" placeholder="Jina ya gari e.g. Scania P360 2018" class="w-full p-3 rounded bg-white text-black">
<select id="fuel" class="w-full p-3 rounded bg-white text-black">
<option>Petrol</option><option>Diesel</option><option>Electric</option>
<option>Hybrid-Petrol</option><option>Hybrid-Diesel</option><option>PHEV-Petrol</option>
<option>Boda Petrol</option><option>Boda Electric</option><option>Boda Diesel</option>
<option>CNG</option><option>LPG</option>
</select>
<select id="cat" class="w-full p-3 rounded bg-white text-black">
<option value="small">Small Cars</option><option value="workhorses">Workhorses</option>
<option value="matatu">Matatu/PSV</option><option value="buses">Buses</option>
<option value="lorries">Lorries</option><option value="boda">Boda Boda</option>
<option value="scania">Scania</option>
<option value="man">MAN</option>
<option value="tipper">Tipper/Construction</option>
<option value="climbing">King of Hill - Climbing Lane</option>
</select>
<textarea id="roast" placeholder="Roast - funny choma" class="w-full p-3 rounded bg-white text-black h-24"></textarea>
<textarea id="brag" placeholder="Brag Card - jibu la kujitetea" class="w-full p-3 rounded bg-white text-black h-24"></textarea>
<button onclick="generate()" class="bg-[#FF4D00] w-full p-3 rounded font-black">GENERATE JSON</button>

<div id="output" class="mt-6 hidden">
<p class="text-sm font-bold">Copy hii uongeze mwisho wa cars.json:</p>
<pre id="code" class="bg-white/10 p-4 rounded text-xs overflow-auto mt-2 max-h-64"></pre>
<div class="flex gap-2 mt-3">
<button onclick="copyCode()" class="bg-white text-black px-4 py-2 rounded text-sm flex-1">Copy</button>
<button onclick="download()" class="bg-[#FF4D00] text-white px-4 py-2 rounded text-sm flex-1">Download Full cars.json</button>
</div>
</div>
</div>
</div>

<script>
let allCars = [];
fetch('./cars.json').then(r=>r.json()).then(d=>{allCars=d;}).catch(()=>{});

async function login(){
 const pass = document.getElementById('pass').value.trim();
 if(!pass){return;}
 document.getElementById('loading').classList.remove('hidden');
 document.getElementById('err').classList.add('hidden');

 try{
  const res = await fetch('/api/check-admin', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({password: pass})
  });
  const data = await res.json();
  if(data.ok){
   document.getElementById('login').classList.add('hidden');
   document.getElementById('panel').classList.remove('hidden');
   localStorage.setItem('mbi_admin_token', data.token);
  } else {
   document.getElementById('err').classList.remove('hidden');
  }
 } catch(e){
  document.getElementById('err').textContent = 'API bado haijawekwa - weka functions/api/check-admin.js';
  document.getElementById('err').classList.remove('hidden');
 }
 document.getElementById('loading').classList.add('hidden');
}

function generate(){
 const n=document.getElementById('name').value.trim();
 const f=document.getElementById('fuel').value;
 const c=document.getElementById('cat').value;
 const r=document.getElementById('roast').value.trim();
 const b=document.getElementById('brag').value.trim();
 if(!n||!r||!b){alert('Jaza zote');return;}
 const id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+f.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now();
 const obj={id:id,name:n,fuel:f,category:c,roast:r,brag:b,tags:[n.split(' ')[0].toLowerCase(),f.toLowerCase(),c]};
 document.getElementById('code').textContent=JSON.stringify(obj,null,2)+',';
 document.getElementById('output').classList.remove('hidden');
 window.lastObj = obj;
}
function copyCode(){
 navigator.clipboard.writeText(document.getElementById('code').textContent);
 alert('Copied!');
}
function download(){
 if(!window.lastObj){alert('Generate kwanza');return;}
 allCars.push(window.lastObj);
 const blob = new Blob([JSON.stringify(allCars,null,2)], {type:'application/json'});
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a'); a.href=url; a.download='cars.json'; a.click();
}

// Auto login kama token iko
const token = localStorage.getItem('mbi_admin_token');
if(token){
 fetch('/api/check-admin', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token})})
.then(r=>r.json()).then(d=>{if(d.ok){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');}});
}
</script>
</body>
  </html>
