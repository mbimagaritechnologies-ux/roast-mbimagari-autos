<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBI Roast Admin - GitHub Auto</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-6">
<div class="max-w-2xl mx-auto">
<h1 class="text-3xl font-black">MBI ADMIN - Add Gari [AUTO]</h1>
<p class="text-white/40 text-xs mt-2">🔒 mbimagaritechnologies-ux/roast-mbimagari-autos main</p>

<div id="login" class="mt-6">
<input id="pass" type="password" placeholder="Weka password ya admin" class="w-full p-3 rounded bg-white text-black">
<button onclick="login()" class="mt-3 bg-[#FF4D00] w-full p-3 rounded font-bold">INGIA</button>
<p id="err" class="text-red-400 text-sm mt-2 hidden"></p>
<p id="loading" class="text-white/60 text-sm mt-2 hidden">Checking...</p>
</div>

<div id="panel" class="hidden mt-6 space-y-4">

<div class="bg-white/10 p-4 rounded">
<h3 class="font-bold text-sm mb-2">⚙️ GitHub Auto Config (mara moja tu)</h3>
<input id="gh_token" type="password" placeholder="GitHub PAT ghp_xxxx" class="w-full p-2 rounded bg-white text-black text-sm mb-2">
<input id="gh_repo" value="mbimagaritechnologies-ux/roast-mbimagari-autos" class="w-full p-2 rounded bg-white text-black text-sm mb-2">
<input id="gh_branch" value="main" class="w-full p-2 rounded bg-white text-black text-sm">
<button onclick="saveGhConfig()" class="mt-2 bg-white/20 px-3 py-1 rounded text-xs">Save Config</button>
<span id="gh_status" class="text-xs ml-2 text-green-400"></span>
</div>

<input id="name" placeholder="Jina ya gari e.g. Scania P360 2018" class="w-full p-3 rounded bg-white text-black font-bold">

<div class="grid grid-cols-2 gap-2">
<select id="fuel" class="w-full p-3 rounded bg-white text-black">
<option>Petrol</option><option>Diesel</option><option>Electric</option>
<option>Hybrid-Petrol</option><option>Hybrid-Diesel</option><option>PHEV-Petrol</option>
<option>Boda Petrol</option><option>Boda Electric</option><option>Boda Diesel</option>
<option>CNG</option><option>LPG</option>
</select>
<select id="cat" class="w-full p-3 rounded bg-white text-black">
<option value="small">Small Cars</option><option value="workhorses">Workhorses</option>
<option value="matatu">Matatu/PSV</option><option value="buses">Buses</option>
<option value="lorries">Lorries</option><option value="boda">Boda Boda</option>
<option value="scania">Scania</option>
<option value="man">MAN</option>
<option value="tipper">Tipper/Construction</option>
<option value="climbing">King of Hill - Climbing Lane</option>
</select>
</div>

<div class="space-y-2">
<p class="text-xs font-bold text-[#FF4D00]">ROASTS 5 - Choma Tena itazunguka hizi</p>
<textarea id="roast1" placeholder="Roast 1 - kali zaidi" class="w-full p-2 rounded bg-white text-black h-20 text-sm"></textarea>
<textarea id="roast2" placeholder="Roast 2" class="w-full p-2 rounded bg-white text-black h-20 text-sm"></textarea>
<textarea id="roast3" placeholder="Roast 3" class="w-full p-2 rounded bg-white text-black h-20 text-sm"></textarea>
<textarea id="roast4" placeholder="Roast 4" class="w-full p-2 rounded bg-white text-black h-20 text-sm"></textarea>
<textarea id="roast5" placeholder="Roast 5 - ya mwisho" class="w-full p-2 rounded bg-white text-black h-20 text-sm"></textarea>
</div>

<textarea id="brag" placeholder="Brag Card - jibu la kujitetea" class="w-full p-3 rounded bg-white text-black h-24"></textarea>

<div class="flex gap-2">
<button onclick="generateAndPush()" id="btnPush" class="bg-[#FF4D00] flex-1 p-3 rounded font-black">🚀 SAVE & PUSH TO GITHUB AUTO</button>
<button onclick="generateOnly()" class="bg-white/20 px-4 py-3 rounded font-bold text-sm">Preview</button>
</div>

<div id="output" class="mt-6 hidden">
<p class="text-sm font-bold" id="outTitle"></p>
<pre id="code" class="bg-white/10 p-4 rounded text-xs overflow-auto mt-2 max-h-64 whitespace-pre-wrap"></pre>
<p id="pushStatus" class="text-sm mt-2"></p>
</div>

</div>
</div>

<script>
let allCars = [];
fetch('./cars.json').then(r=>r.json()).then(d=>{allCars=d;}).catch(()=>{});
document.getElementById('gh_token').value = localStorage.getItem('mbi_gh_token')||'';
document.getElementById('gh_repo').value = localStorage.getItem('mbi_gh_repo')||'mbimagaritechnologies-ux/roast-mbimagari-autos';
document.getElementById('gh_branch').value = localStorage.getItem('mbi_gh_branch')||'main';
if(localStorage.getItem('mbi_gh_token')) document.getElementById('gh_status').textContent='✓ saved';
function saveGhConfig(){
 localStorage.setItem('mbi_gh_token', document.getElementById('gh_token').value.trim());
 localStorage.setItem('mbi_gh_repo', document.getElementById('gh_repo').value.trim());
 localStorage.setItem('mbi_gh_branch', document.getElementById('gh_branch').value.trim());
 document.getElementById('gh_status').textContent='✓ saved';
}
async function login(){
 const pass = document.getElementById('pass').value.trim();
 if(!pass){return;}
 document.getElementById('loading').classList.remove('hidden');
 document.getElementById('err').classList.add('hidden');
 try{
  const res = await fetch('/api/check-admin', {method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({password: pass})});
  const data = await res.json();
  if(data.ok){
   document.getElementById('login').classList.add('hidden');
   document.getElementById('panel').classList.remove('hidden');
   localStorage.setItem('mbi_admin_token', data.token);
  } else {
   document.getElementById('err').textContent='Wrong password';
   document.getElementById('err').classList.remove('hidden');
  }
 } catch(e){
  document.getElementById('err').textContent = 'API bado haijawekwa';
  document.getElementById('err').classList.remove('hidden');
 }
 document.getElementById('loading').classList.add('hidden');
}
function buildObj(){
 const n=document.getElementById('name').value.trim();
 const f=document.getElementById('fuel').value;
 const c=document.getElementById('cat').value;
 const r1=document.getElementById('roast1').value.trim();
 const r2=document.getElementById('roast2').value.trim();
 const r3=document.getElementById('roast3').value.trim();
 const r4=document.getElementById('roast4').value.trim();
 const r5=document.getElementById('roast5').value.trim();
 const b=document.getElementById('brag').value.trim();
 if(!n||!r1||!b){alert('Jaza jina, roast1 na brag');return null;}
 const roasts = [r1,r2,r3,r4,r5].filter(x=>x.length>3);
 const id=n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+f.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now();
 const obj={id:id,name:n,fuel:f,category:c,roast:roasts[0],roasts:roasts,brag:b,bragRoasts:[b],tags:[n.split(' ')[0].toLowerCase(),f.toLowerCase(),c]};
 return obj;
}
function generateOnly(){
 const obj = buildObj(); if(!obj) return;
 document.getElementById('code').textContent=JSON.stringify(obj,null,2);
 document.getElementById('outTitle').textContent='Preview:';
 document.getElementById('output').classList.remove('hidden');
}
async function generateAndPush(){
 const obj = buildObj(); if(!obj) return;
 const ghToken = document.getElementById('gh_token').value.trim() || localStorage.getItem('mbi_gh_token');
 const ghRepo = document.getElementById('gh_repo').value.trim();
 const ghBranch = document.getElementById('gh_branch').value.trim()||'main';
 if(!ghToken){alert('Weka GitHub PAT');return;}
 document.getElementById('btnPush').textContent='⏳ Inapush...'; document.getElementById('btnPush').disabled=true;
 try{
  const getRes = await fetch(`https://api.github.com/repos/${ghRepo}/contents/cars.json?ref=${ghBranch}`, {headers: { 'Authorization': `Bearer ${ghToken}`, 'Accept':'application/vnd.github.v3+json' }});
  if(!getRes.ok){ throw new Error('Imeshindwa kupata cars.json: '+await getRes.text()); }
  const fileData = await getRes.json(); const sha = fileData.sha;
  const contentStr = atob(fileData.content.replace(/\n/g,'')); let cars = JSON.parse(contentStr);
  cars.push(obj);
  const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(cars,null,2))));
  const putRes = await fetch(`https://api.github.com/repos/${ghRepo}/contents/cars.json`, {method:'PUT',headers: { 'Authorization': `Bearer ${ghToken}`, 'Accept':'application/vnd.github.v3+json', 'Content-Type':'application/json' },body: JSON.stringify({message: `Add gari: ${obj.name} - ${obj.fuel}`,content: newContent,sha: sha,branch: ghBranch})});
  if(!putRes.ok){ throw new Error('Push failed: '+await putRes.text()); }
  document.getElementById('code').textContent=JSON.stringify(obj,null,2);
  document.getElementById('outTitle').textContent='✅ Imefanikiwa!';
  document.getElementById('pushStatus').innerHTML=`<span class="text-green-400 font-bold">Ime-push! Cloudflare ita-deploy 30 sec. Gari: ${obj.name}</span>`;
  document.getElementById('output').classList.remove('hidden');
 }catch(err){
  document.getElementById('outTitle').textContent='❌ Error';
  document.getElementById('code').textContent=err.message;
  document.getElementById('output').classList.remove('hidden');
 }
 document.getElementById('btnPush').textContent='🚀 SAVE & PUSH TO GITHUB AUTO'; document.getElementById('btnPush').disabled=false;
}
const token = localStorage.getItem('mbi_admin_token');
if(token){ fetch('/api/check-admin', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token})}).then(r=>r.json()).then(d=>{if(d.ok){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');}});}
</script>
</body>
</html>
