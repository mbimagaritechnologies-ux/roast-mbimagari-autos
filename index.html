<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBI Roast - Choma Gari 🔥</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FF4D00">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:#000;color:#fff;padding:15px;}
.header{text-align:center;padding:20px 0;}
.header h1{font-size:32px;color:#FF4D00;}
.header p{color:#aaa;margin-top:5px;}
.searchBox{position:sticky;top:10px;z-index:10;background:#000;padding:10px 0;}
.searchBox input{width:100%;padding:16px;border-radius:12px;border:2px solid #FF4D00;background:#111;color:#fff;font-size:18px;}
.filters{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:5px;}
.filters button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid #333;background:#111;color:#fff;}
.filters button.active{background:#FF4D00;border-color:#FF4D00;}
#results{display:grid;gap:12px;margin-top:15px;}
.card{border:1px solid #222;background:linear-gradient(135deg,#111,#1a1a1a);padding:18px;border-radius:16px;}
.card h3{color:#FF4D00;font-size:20px;}
.card p{margin:10px 0;line-height:1.5;font-size:16px;}
.card.btns{display:flex;gap:8px;margin-top:12px;}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;}
.btn-roast{background:#FF4D00;color:#fff;flex:1;}
.btn-brag{background:#fff;color:#000;flex:1;}
#bragCanvas{display:none;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;justify-content:center;align-items:center;padding:15px;z-index:99;}
.modalContent{background:#111;border-radius:16px;padding:15px;max-width:400px;width:100%;text-align:center;}
</style>
</head>
<body>
<div class="header">
<h1>🔥 MBI ROAST</h1>
<p>Choma gari, jitetee na brag card</p>
</div>
<div class="searchBox">
<input id="searchInput" onkeyup="searchCars()" placeholder="Tafuta Probox, Vitz, Boxer, Scania, Yutong...">
<div class="filters" id="filterBar">
<button class="active" onclick="filterType('all',this)">Zote</button>
<button onclick="filterType('Small',this)">Vitz/Subaru</button>
<button onclick="filterType('Probox',this)">Probox</button>
<button onclick="filterType('Matatu',this)">Matatu</button>
<button onclick="filterType('Lorry',this)">Lorry</button>
<button onclick="filterType('Boda',this)">Boda</button>
<button onclick="filterType('Bus',this)">Bus</button>
</div>
</div>

<div id="results">Loading magari...</div>

<div class="modal" id="bragModal">
<div class="modalContent">
<canvas id="bragCanvas" width="1080" height="1350"></canvas>
<img id="bragImage" style="width:100%;border-radius:12px;">
<br><br>
<button class="btn btn-roast" onclick="downloadBrag()">Download Brag Card 📥</button>
<button class="btn" style="background:#333;color:#fff;margin-top:8px;" onclick="closeModal()">Funga</button>
</div>
</div>
<script>
let allCars = [];
let currentFilter = 'all';

async function loadCars(){
  try{
    const res = await fetch('./cars.json?v='+Date.now());
    const data = await res.json();
    allCars = Array.isArray(data)? data : data.cars || [];
    showCars(allCars);
  }catch(e){
    document.getElementById('results').innerHTML = '❌ Error: cars.json haipatikani. '+e.message;
  }
}

function showCars(list){
  const box = document.getElementById('results');
  if(!list.length){ box.innerHTML = '<p style="text-align:center;color:#666;margin-top:30px;">Hakuna gari ya "'+document.getElementById('searchInput').value+'"</p>'; return; }
  box.innerHTML = list.map((c,i)=>{
    const model = c.model || c.name || 'Gari';
    const roast = c.roast || (c.roasts && c.roasts[0]) || 'Hii gari ni noma!';
    const fuel = c.fuel || c.type || '';
    return `<div class="card">
      <h3>${model} <span style="font-size:12px;color:#888;">${fuel}</span></h3>
      <p>${roast}</p>
      <div class="btns">
        <button class="btn btn-roast" onclick="nextRoast(${i})">Choma Tena 🔥</button>
        <button class="btn btn-brag" onclick="makeBrag(${i})">Brag Card ✨</button>
      </div>
    </div>`;
  }).join('');
}

function searchCars(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let filtered = allCars;
  if(currentFilter!== 'all'){
    filtered = filtered.filter(c => (c.model||c.name||'').toLowerCase().includes(currentFilter.toLowerCase()) || (c.category||'').toLowerCase().includes(currentFilter.toLowerCase()));
  }
  if(q){
    filtered = filtered.filter(c => ((c.model||c.name||'')+' '+(c.roast||'')+' '+(c.fuel||'')).toLowerCase().includes(q));
  }
  showCars(filtered);
}

function filterType(type, btn){
  currentFilter = type;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  searchCars();
}

function nextRoast(index){
  const car = allCars[index];
  if(!car) return;
  let roasts = car.roasts || [car.roast];
  if(roasts.length < 2) return alert('Hii ndio roast pekee ya '+car.model);
  const random = roasts[Math.floor(Math.random()*roasts.length)];
  const cards = document.querySelectorAll('.card');
  if(cards[index]) cards[index].querySelector('p').innerText = random;
}

function makeBrag(index){
  const car = allCars[index];
  const model = car.model || car.name;
  const roast = car.roast || car.roasts[0];
  const canvas = document.getElementById('bragCanvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,1080,1350);
  ctx.fillStyle = '#FF4D00'; ctx.fillRect(0,0,1080,20);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 70px system-ui'; ctx.fillText('🔥 MBI ROAST', 50, 120);
  ctx.font = 'bold 50px system-ui'; ctx.fillStyle = '#FF4D00'; ctx.fillText(model.toUpperCase(), 50, 220);
  ctx.fillStyle = '#fff'; ctx.font = '28px system-ui';
  wrapText(ctx, roast, 50, 300, 980, 42);
  ctx.fillStyle = '#888'; ctx.font = '22px system-ui'; ctx.fillText('roast.mbimagari.autos', 50, 1280);
  const img = document.getElementById('bragImage');
  img.src = canvas.toDataURL('image/png');
  document.getElementById('bragModal').style.display = 'flex';
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' '); let line = '';
  for(let n=0;n<words.length;n++){
    let testLine = line + words[n] + ' ';
    let metrics = ctx.measureText(testLine);
    if(metrics.width > maxWidth && n>0){ ctx.fillText(line, x, y); line = words[n]+' '; y+=lineHeight; }
    else line = testLine;
  }
  ctx.fillText(line, x, y);
}
function downloadBrag(){
  const link = document.createElement('a');
  link.download = 'MBI-Brag-Card.png';
  link.href = document.getElementById('bragImage').src;
  link.click();
}
function closeModal(){ document.getElementById('bragModal').style.display='none'; }

loadCars();
</script>
</body>
</html>
