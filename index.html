<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBI Roast - Choma Gari 🔥</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FF4D00">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:#000;color:#fff;padding:12px;max-width:600px;margin:auto;}
.header{text-align:center;padding:18px 0 10px;}
.header h1{font-size:32px;color:#FF4D00;}
.header p{color:#999;margin-top:4px;}
.searchWrap{position:sticky;top:8px;z-index:20;background:#000;padding:8px 0 6px;}
.searchRow{display:flex;gap:8px;}
.searchRow input{flex:1;padding:16px 14px;border-radius:14px;border:2px solid #FF4D00;background:#111;color:#fff;font-size:17px;outline:none;}
.iconBtn{width:52px;height:52px;border-radius:14px;border:2px solid #333;background:#111;color:#fff;font-size:22px;cursor:pointer;}
#fuelChips,.filters{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;}
.chip{white-space:nowrap;padding:7px 13px;border-radius:20px;border:1px solid #333;background:#111;color:#fff;font-size:13px;cursor:pointer;}
.chip.active,.chip.fuel{background:#FF4D00;border-color:#FF4D00;}
#results{display:grid;gap:14px;margin-top:14px;padding-bottom:80px;}
.card{border:1px solid #222;background:linear-gradient(135deg,#141414,#1c1c1c);padding:16px;border-radius:18px;}
.card h3{color:#FF4D00;font-size:19px;display:flex;justify-content:space-between;}
.badge{font-size:11px;background:#222;color:#aaa;padding:4px 8px;border-radius:10px;}
.card p{margin:11px 0 0;line-height:1.55;font-size:15.5px;color:#eee;}
.btns{display:flex;gap:8px;margin-top:14px;}
.btn{padding:11px 10px;border-radius:11px;border:none;font-weight:800;cursor:pointer;font-size:14px;flex:1;}
.btn-roast{background:#FF4D00;color:#fff;}
.btn-brag{background:#fff;color:#000;}
.btn-share{background:#111;color:#fff;border:1px solid #333;flex:0.6;}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;justify-content:center;align-items:center;padding:14px;z-index:99;}
.modalContent{background:#111;border:1px solid #222;border-radius:18px;padding:14px;max-width:420px;width:100%;text-align:center;}
#listening{font-size:13px;color:#FF4D00;text-align:center;margin-top:6px;display:none;}
.payModal{background:#111;border-radius:18px;padding:20px;text-align:center;}
</style>
</head>
<body>
<div class="header">
<h1>🔥 MBI ROAST</h1>
<p>Lipa 50 KES upate Brag Card ya kuchoma</p>
</div>
<div class="searchWrap">
<div class="searchRow">
<input id="searchInput" onkeyup="searchCars()" placeholder="Andika: Probox, Vitz, Boxer, Scania...">
<button class="iconBtn" onclick="startVoice()">🎤</button>
</div>
<div id="listening">🎤 Nasikiliza... sema Probox, Vitz</div>
<div class="filters" id="filterBar">
<button class="chip active" onclick="filterType('all',this)">Zote</button>
<button class="chip" onclick="filterType('Small',this)">Small Cars</button>
<button class="chip" onclick="filterType('Probox',this)">Probox</button>
<button class="chip" onclick="filterType('Matatu',this)">Matatu</button>
<button class="chip" onclick="filterType('Lorry',this)">Lorry</button>
<button class="chip" onclick="filterType('Boda',this)">Boda</button>
<button class="chip" onclick="filterType('Bus',this)">Bus</button>
</div>
<div id="fuelChips"></div>
</div>
<div id="results">Loading magari 50+...</div>
<div class="modal" id="bragModal">
<div class="modalContent">
<canvas id="bragCanvas" width="1080" height="1350" style="display:none;"></canvas>
<img id="bragImage" style="width:100%;border-radius:14px;border:1px solid #222;">
<div style="display:flex;gap:8px;margin-top:12px;">
<button class="btn btn-roast" onclick="downloadBrag()" style="flex:1;">Download 📥</button>
<button class="btn btn-brag" onclick="shareBrag()" style="flex:1;">Share 🔗</button>
</div>
<button class="btn" style="background:#222;color:#fff;width:100%;margin-top:8px;" onclick="closeModal('bragModal')">Funga</button>
</div>
</div>

<div class="modal" id="payModal">
<div class="modalContent payModal">
<h3 style="color:#FF4D00;font-size:22px;">🔥 Unlock Brag Card</h3>
<p style="margin:12px 0;color:#ccc;">Lipa <b>KES 50</b> tu upakue brag card yenye design kali ya <span id="payCarName">gari yako</span> ushare TikTok/WhatsApp.</p>
<p style="font-size:12px;color:#666;margin-bottom:14px;">Roast ya kusoma ni FREE. Brag card ndio inalipishwa.</p>
<button class="btn btn-roast" style="width:100%;padding:14px;font-size:16px;" onclick="payNow()">Lipa 50 KES na Paystack</button>
<button class="btn" style="background:#222;color:#fff;width:100%;margin-top:8px;" onclick="closeModal('payModal')">Sina pesa sasa</button>
</div>
  </div>
  <script>
const PAYSTACK_KEY = 'pk_live_d8d08c19442cc7d6016a54aec79a8e5ba2aa048a';
let allCars = [];
let filteredCars = [];
let currentFilter = 'all';
let currentFuel = 'all';
let pendingBragId = null;
let roastPointer = {};

async function loadCars(){
  try{
    const res = await fetch('./cars.json?v='+Date.now());
    const data = await res.json();
    allCars = Array.isArray(data)? data : data.cars || [];
    allCars = allCars.map(c=>{
      if(c.roasts && c.roasts.length>0) return c;
      if(c.roast) return {...c, roasts:[c.roast]};
      return c;
    });
    showCars(allCars);
  }catch(e){
    document.getElementById('results').innerHTML = '❌ cars.json error: '+e.message;
  }
}
function getCarId(car){ return car.id || (car.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
function isPaid(car){
  const id = getCarId(car);
  return!!localStorage.getItem('mbi_paid_'+id);
}
function showCars(list){
  filteredCars = list;
  const box = document.getElementById('results');
  if(!list.length){ box.innerHTML = `<p style="text-align:center;color:#666;margin-top:40px;">Hakuna "${document.getElementById('searchInput').value}"</p>`; return; }
  box.innerHTML = list.map(c=>{
    const model = c.model || c.name || 'Gari';
    const fuel = c.fuel || 'Petrol';
    const cat = c.category || '';
    const carId = getCarId(c);
    if(roastPointer[carId]===undefined) roastPointer[carId]=0;
    const roasts = c.roasts || [c.roast||'Hii gari noma!'];
    const roast = roasts[roastPointer[carId] % roasts.length];
    const paid = isPaid(c);
    return `<div class="card">
      <h3>${model.toUpperCase()} <span class="badge">${fuel} • ${cat} ${paid?'• ✅PAID':''}</span></h3>
      <p id="roast-${carId}">${roast}</p>
      <div class="btns">
        <button class="btn btn-roast" onclick="nextRoast('${carId}')">Choma Tena 🔥 ${roasts.length>1?`(${roastPointer[carId]+1}/${roasts.length})`:''} FREE</button>
        <button class="btn btn-brag" onclick="makeBragById('${carId}')">${paid?'Brag Card ✨':'Brag Card 50KES 🔒'}</button>
        <button class="btn btn-share" onclick="shareTextById('${carId}')">Share</button>
      </div>
    </div>`;
  }).join('');
}
function searchCars(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const fuelBox = document.getElementById('fuelChips');
  let filtered = [...allCars];
  if(currentFilter!=='all') filtered = filtered.filter(c=> ((c.model||c.name||'')+' '+(c.category||'')).toLowerCase().includes(currentFilter.toLowerCase()));
  if(currentFuel!=='all') filtered = filtered.filter(c=> (c.fuel||'').toLowerCase()===currentFuel.toLowerCase());
  if(q){
    filtered = filtered.filter(c=>{
      const hay = ((c.model||c.name||'')+' '+(c.category||'')+' '+(c.tags||[]).join(' ')).toLowerCase();
      const roastHay = (c.roast||'').toLowerCase() + ' ' + (c.roasts||[]).join(' ').toLowerCase();
      if((c.fuel||'').toLowerCase()===q) return true;
      if(q==='petrol' && (c.fuel||'').toLowerCase()!=='petrol') return false;
      if(q==='electric' && (c.fuel||'').toLowerCase()!=='electric' &&!(c.fuel||'').toLowerCase().includes('electric')) return false;
      return hay.includes(q) || roastHay.includes(q);
    });
  }
  if(q && filtered.length>0){
    const fuels = [...new Set(filtered.map(c=>c.fuel).filter(Boolean))];
    if(fuels.length>1){
      fuelBox.innerHTML = fuels.map(f=>`<button class="chip fuel ${currentFuel===f?'active':''}" onclick="setFuel('${f}')">${f}</button>`).join('') + `<button class="chip" onclick="setFuel('all')">Clear ✕</button>`;
    } else fuelBox.innerHTML='';
  } else if(!q) fuelBox.innerHTML='';
  showCars(filtered);
}
function filterType(type, btn){
  currentFilter = type;
  document.querySelectorAll('#filterBar.chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  searchCars();
}
function setFuel(f){ currentFuel = f; searchCars(); }
function nextRoast(carId){
  const car = filteredCars.find(c=> getCarId(c)===carId) || allCars.find(c=> getCarId(c)===carId);
  if(!car) return;
  const roasts = car.roasts || [car.roast];
  roastPointer[carId] = (roastPointer[carId]+1) % roasts.length;
  const r = roasts[roastPointer[carId]];
  const el = document.getElementById('roast-'+carId);
  if(el) el.innerText = r;
  showCars(filteredCars);
  setTimeout(()=>{ const el2=document.getElementById('roast-'+carId); if(el2) el2.innerText=r; },20);
}
function getCarById(id){ return filteredCars.find(c=>getCarId(c)===id) || allCars.find(c=>getCarId(c)===id); }
function shareTextById(carId){
  const car = getCarById(carId);
  const roast = document.getElementById('roast-'+carId).innerText;
  const text = `🔥 ROAST YA ${ (car.model||car.name).toUpperCase()} (${car.fuel||''}) 🔥\n\n${roast}\n\nChoma yako: https://roast.mbimagari.autos`;
  if(navigator.share) navigator.share({title:'MBI Roast', text}); else navigator.clipboard.writeText(text).then(()=>alert('Copied!'));
}
function makeBragById(carId){
  pendingBragId = carId;
  const car = getCarById(carId);
  if(!isPaid(car)){
    document.getElementById('payCarName').innerText = (car.model||car.name||'gari yako').toUpperCase();
    document.getElementById('payModal').style.display='flex';
    return;
  }
  generateCardById(carId);
}
function payNow(){
  const car = getCarById(pendingBragId);
  const carId = getCarId(car);
  const handler = PaystackPop.setup({
    key: PAYSTACK_KEY,
    email: 'roast@mbimagari.autos',
    amount: 5000,
    currency: 'KES',
    ref: 'MBI-'+Date.now()+'-'+carId,
    callback: function(response){
      localStorage.setItem('mbi_paid_'+carId, response.reference);
      Object.keys(localStorage).forEach(k=>{ if(/^mbi_paid_\d+$/.test(k)) localStorage.removeItem(k); });
      closeModal('payModal');
      alert('✅ Malipo yamekubaliwa! Ref: '+response.reference);
      generateCardById(carId);
      searchCars();
    },
    onClose: function(){ alert('Umefunga malipo'); }
  });
  handler.openIframe();
}
function generateCardById(carId){
  const car = getCarById(carId);
  const roast = document.getElementById('roast-'+carId).innerText;
  const model = (car.model||car.name||'GARI').toUpperCase();
  const fuel = car.fuel||'';
  const canvas = document.getElementById('bragCanvas');
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,1350);
  grad.addColorStop(0,'#1a1a1a'); grad.addColorStop(1,'#000000');
  ctx.fillStyle = grad; ctx.fillRect(0,0,1080,1350);
  ctx.fillStyle = '#FF4D00'; ctx.fillRect(0,0,1080,18);
  ctx.fillStyle = '#141414'; ctx.strokeStyle = '#2a2a2a';
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  roundRect(40,60,1000,1220,24);
  ctx.fillStyle = '#FF4D00'; ctx.font = '900 48px system-ui'; ctx.fillText('🔥 MBI ROAST', 80, 150);
  ctx.fillStyle = '#fff'; ctx.font = '800 62px system-ui'; ctx.fillText(model, 80, 240);
  ctx.fillStyle = '#FF4D00'; ctx.font = '600 28px system-ui'; ctx.fillText(fuel.toUpperCase()+' • '+(car.category||'ROAST'), 80, 285);
  ctx.fillStyle = '#f0f0f0'; ctx.font = '32px system-ui';
  const words=roast.split(' '); let line=''; let y=360;
  for(let n=0;n<words.length;n++){ let test=line+words[n]+' '; if(ctx.measureText(test).width>920 && n>0){ ctx.fillText(line,80,y); line=words[n]+' '; y+=48; } else line=test; } ctx.fillText(line,80,y);
  ctx.fillStyle = '#666'; ctx.font = '24px system-ui'; ctx.fillText('roast.mbimagari.autos • KES 50 PAID', 80, 1240);
  const img = document.getElementById('bragImage');
  img.src = canvas.toDataURL('image/png');
  document.getElementById('bragModal').style.display='flex';
}
function downloadBrag(){ const a=document.createElement('a'); a.download='MBI-Roast-'+Date.now()+'.png'; a.href=document.getElementById('bragImage').src; a.click(); }
async function shareBrag(){
  const img = document.getElementById('bragImage').src;
  try{
    const blob = await (await fetch(img)).blob();
    const file = new File([blob],'roast.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'MBI Roast'});
    else throw 'no share';
  }catch(e){ downloadBrag(); }
}
function closeModal(id){ document.getElementById(id).style.display='none'; }
function startVoice(){
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech){ alert('Tumia Chrome Android'); return; }
  const rec = new Speech(); rec.lang='sw-KE'; document.getElementById('listening').style.display='block'; rec.start();
  rec.onresult=(e)=>{ document.getElementById('searchInput').value=e.results[0][0].transcript; document.getElementById('listening').style.display='none'; searchCars(); };
  rec.onend=()=>{ document.getElementById('listening').style.display='none'; };
}
loadCars();
</script>
</body>
</html>
